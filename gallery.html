    <div>

            <p><strong>Drawn by:</strong> Artist A</p>
            <p><strong>For:</strong> Artist B</p>
          </div>
        </div>

        <!-- Example Artwork Card 2 -->
        <div class="art-card">
          <a href="URL_TO_IMAGE_2" target="_blank"><img src="URL_TO_IMAGE_2" alt="Gift artwork"></a>
          <div class="art-card-body">
            <p><strong>Drawn by:</strong> Artist C</p>
            <p><strong>For:</strong> Artist D</p>
          </div>
        </div>
      </div>
    </section>
