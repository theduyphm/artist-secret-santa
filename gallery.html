<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Secret Santa - 2025 Gallery 🎨🎄</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
  <header>
    <h1>🎨 2025 Secret Santa Gallery 🎄</h1>
    <div>
      <a href="index.html"><button class="secondary">← Back to Current Event</button></a>
    </div>
  </header>

  <main>
    <section class="card" style="max-width: 1000px; margin: 0 auto;">
      <h2>✨ 2025 Gallery ✨</h2>
      <p>Thank you all participants ☃️🎄🎁❤️</p>


      <!-- Grid Container -->
      <div id="gallery-grid" class="image-grid"></div>
    </section>
  </main>

  <script>
    // List your past artwork file names/URLs here!
    // If you put them in a folder named 'gallery-2025/', you can list them like this:
    const pastArtworks = [
      { img: "gallery-2025/artwork1.png", drawnBy: "Artist A", forWho: "Artist B" },
      { img: "gallery-2025/artwork2.png", drawnBy: "Artist C", forWho: "Artist D" },
      // Add as many as you like here!
    ];

    const gridContainer = document.getElementById('gallery-grid');

    if (pastArtworks.length === 0) {
      gridContainer.innerHTML = '<p><em>No artworks added to the gallery yet!</em></p>';
    } else {
      gridContainer.innerHTML = pastArtworks.map(art => `
                <div class="art-card gallery-item">
                    <a href="${art.img}" target="_blank"><img src="${art.img}" alt="Gift by ${art.drawnBy}"></a>
                    <div class="art-card-body">
                        <p><strong>Drawn by:</strong> ${art.drawnBy}</p>
                        <p><strong>For:</strong> ${art.forWho}</p>
                    </div>
                </div>
            `).join('');
    }
  </script>
</body>

</html>
