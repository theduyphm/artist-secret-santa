<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Secret Santa - 2025 Gallery 🎨🎄</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
  <header>
    <h1>🎨 2025 Secret Santa Gallery 🎄</h1>
    <div>
      <a href="index.html"><button class="secondary">← Back to Current Event</button></a>
    </div>
  </header>

  <main>
    <section class="card" style="max-width: 1000px; margin: 0 auto;">
      <h2>✨ 2025 Gallery ✨</h2>
      <p>Thank you all participants ☃️🎄🎁❤️</p>


      <!-- Grid Container -->
      <div id="gallery-grid" class="image-grid"></div>
    </section>
  </main>

  <script>
    // List the filenames of the pictures you put inside your gallery_2025 folder
    const pastArtworks = [
      { file: "artwork1.jpg", drawnBy: "Sleepypeanut", forWho: "Miyako" },
      { file: "artwork2.jpg", drawnBy: "DonutRaven", forWho: "H. Chia" },
      { file: "artwork3.jpg", drawnBy: "Inkcap Mika", forWho: "Sara Macias" },
      { file: "artwork4.jpg", drawnBy: "Alenorjs", forWho: "donutraven" },
      { file: "artwork5.jpg", drawnBy: "Sara Macias", forWho: "Alenorjs" },
      { file: "artwork6.jpg", drawnBy: "Xena & Kin", forWho: "Gemms of Art" },
      { file: "artwork7.jpg", drawnBy: "Bunmorie", forWho: "AnnVi" },
      { file: "artwork8.jpg", drawnBy: "AnnVi", forWho: "Dazed Rainbow" },
      { file: "artwork9.jpg", drawnBy: "Miyako", forWho: "SketchtTheWorldAway" },
      { file: "artwork10.jpg", drawnBy: "Nimbon", forWho: "Xéna & Kin" },
      { file: "artwork11.jpg", drawnBy: "Gemms of Arts", forWho: "MONNO" },
      { file: "artwork12.jpg", drawnBy: "Monno", forWho: "Bunmorie" },
      { file: "artwork13.jpg", drawnBy: "H. Chia", forWho: "Selinas Arts" },
      { file: "artwork14.jpg", drawnBy: "Anna Abramek", forWho: "Nimbon" },
      { file: "artwork15.jpg", drawnBy: "Kune Arts", forWho: "Anna Abramek" },
      { file: "artwork16.jpg", drawnBy: "Selinas Arts", forWho: "Inkcap Mika" },
      { file: "artwork17.jpg", drawnBy: "DazedRainbow", forWho: "SleepyPeanutpot" },
      { file: "artwork18.jpg", drawnBy: "SketchTheWorldAway", forWho: "Kune Arts" }

      // Just add more lines here for each picture you have!
    ];

    const gridContainer = document.getElementById('gallery-grid');

    if (pastArtworks.length === 0) {
      gridContainer.innerHTML = '<p><em>No artworks added to the gallery yet!</em></p>';
    } else {
      gridContainer.innerHTML = pastArtworks.map(art => {
        // Automatically builds the path: gallery_2025/filename.png
        const imgPath = `gallery_2025/${art.file}`;
        return `
                <div class="art-card gallery-item">
                    <a href="${imgPath}" target="_blank"><img src="${imgPath}" alt="Gift by ${art.drawnBy}"></a>
                    <div class="art-card-body">
                        <p><strong>Drawn by:</strong> ${art.drawnBy}</p>
                        <p><strong>For:</strong> ${art.forWho}</p>
                    </div>
                </div>
            `;
      }).join('');
    }
  </script>
</body>

</html>
